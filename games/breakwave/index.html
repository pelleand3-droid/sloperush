<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f0e5" />
    <title>BREAKWAVE — one more brick</title>
    <link rel="stylesheet" href="style.css" />
    <script src="supabase-config.js"></script>
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="BREAKWAVE home"><span class="brand-icon" aria-hidden="true">✳</span> BREAK<span>WAVE</span></a>
        <div class="hud" aria-live="polite">
          <div class="stat"><span class="label">Score</span><strong id="score">0</strong></div>
          <div class="stat"><span class="label">Best</span><strong id="best">0</strong></div>
          <div class="stat"><span class="label">Balls</span><strong id="shards">3</strong></div>
        </div>
        <button id="musicToggle" class="music-toggle" type="button" aria-pressed="true" aria-label="Turn music off">♫</button>
        <div id="accountBar" class="account-bar" hidden>
          <span id="accountName"></span>
          <button id="signOutButton" type="button">Sign out</button>
        </div>
      </header>

      <section class="playfield" aria-label="BREAKWAVE brick-breaking game">
        <canvas id="gameCanvas" width="900" height="600" aria-label="Break the blocks with a bouncing ball"></canvas>
        <div class="world-label"><span id="worldLabel">ROUND 01</span></div>
        <div id="challengeTracker" class="challenge-tracker" aria-live="polite" hidden></div>
        <div id="extraXpPopup" class="extra-xp-popup" role="status" aria-live="polite" hidden></div>
        <div id="overlay" class="overlay visible" aria-live="polite"></div>
        <div class="controls-hint"><kbd>←</kbd> <kbd>→</kbd> MOVE <span>·</span> CLICK / <kbd>SPACE</kbd> LAUNCH <span>·</span> <kbd>SHIFT</kbd> PULSE</div>
        <div class="touch-controls" aria-label="Paddle controls">
          <div class="dpad">
            <button id="leftButton" type="button" aria-label="Move paddle left">←</button>
            <button id="rightButton" type="button" aria-label="Move paddle right">→</button>
          </div>
          <div class="touch-actions">
            <button id="jumpButton" class="serve-button" type="button" aria-label="Launch ball">LAUNCH</button>
            <button id="crouchButton" class="pulse-button" type="button" aria-label="Activate paddle pulse">PULSE</button>
          </div>
          <button id="boostButton" type="button" hidden aria-label="Activate paddle pulse">PULSE</button>
        </div>
      </section>
      <footer class="footer"><span>DON'T LET IT DROP.</span><span id="boostStatus">PULSE READY</span></footer>
    </main>
    <script src="game.js"></script>
  </body>
</html>
